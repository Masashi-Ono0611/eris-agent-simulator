# masa-ascon league, round U1 (new upstream world; R1 roster + zeta-2), round 1 (pilot): 6 players + references + the current incumbent, all in one world.
# Everyone runs frozen (no LLM revision) so the round measures the strategies themselves.
agents:
  - id: noop
    wallet: AUTO
    baseline: true
    description: does nothing (baseline, outside the population)
  - id: multi-arb
    wallet: AUTO
    env: { ERIS_AGENT_FROZEN: "1" }
  - id: clean-arb
    wallet: AUTO
    env: { ERIS_AGENT_FROZEN: "1" }
  - id: venue-arb
    wallet: AUTO
    env: { ERIS_AGENT_FROZEN: "1" }
  - id: inc-zeta
    dir: ascon-zeta
    wallet: AUTO
    env: { ERIS_AGENT_FROZEN: "1", ASCON_DELTA_PARAMS: '{"bidMode":2,"bidProfitShareBps":3000,"gasPerSwap":140000}' }
    description: incumbent (zeta-a30 from the isolated suite)
  - { id: astra-1, wallet: AUTO, env: { ERIS_AGENT_FROZEN: "1" } }
  - { id: astra-2, wallet: AUTO, env: { ERIS_AGENT_FROZEN: "1" } }
  - { id: sonnet-1, wallet: AUTO, env: { ERIS_AGENT_FROZEN: "1" } }
  - { id: sonnet-2, wallet: AUTO, env: { ERIS_AGENT_FROZEN: "1" } }
  - { id: opus-1, wallet: AUTO, env: { ERIS_AGENT_FROZEN: "1" } }
  - { id: grok-1, wallet: AUTO, env: { ERIS_AGENT_FROZEN: "1" } }
  - { id: zeta-2, wallet: AUTO, env: { ERIS_AGENT_FROZEN: "1" } }
