  function plan(){const steps=D.plan.protocol.filter(s=>s.start_date);const highlighted=D.milestones.items.filter(m=>m.highlight);return `<div class="summary-strip"><h2>${rich(D.plan.goal)}</h2><p>締切 ${time(D.plan.deadline_at)} · MASTER rev ${D.plan.revision} · ${rich(D.ui.copy.plan_note)}</p></div>

  function scopeText(s){return `${s.field} · ${s.regimes}レジーム · seed${s.seeds} · ${s.worlds}世界`;}
  function safetyText(path){
    const value=read(path);
    if(path==='status.dev4'){const r=value.result;return `全${r.positive_regimes}レジーム平均(T−Tnoop)>0、最小${r.min_regime_t_minus_noop}。noop割れ${r.noop_below}・違反${r.violations}・cand revert ${r.reverts}。submitted ${r.submitted} / failed ${r.submit_failed}（${r.submit_failed_percent}%）。G0 ${value.g0}・${value.loops}ループ。`;}
    if(path==='status.dev3'){const r=value.result;return `P−noopは全${r.positive_worlds}世界で正（最小値未提示）。noop割れ${r.noop_below}・違反${r.violations}・revert ${r.reverts}。submit_failed ${r.submit_failed} / submitted ${r.submitted}。G0 ${value.g0}。`;}
    if(path==='status.dev2'){const r=value.result;return `P−noopは全${r.positive_worlds}世界で正、最小${r.min_p_minus_noop}。noop割れ${r.noop_below}・違反${r.violations}・revert ${r.reverts}。G0 ${value.g0}。`;}

  }

    <div class="stack section">${details('原判断・署名・過去の未決提案（当時の履歴）',`<div class="stack">${ds.filter(d=>d.group!=='current'&&d.id!=='dec-007').map(decisionCard).join('')}</div>`)}${details('旧H1・AI契約・資格試験・失敗上限',rawTable(D.results.h1)+rawTable({...D.plan.ai_parameters,title:'rev 6のENTRY単独契約（原記録・初期60）'})+keyValues(D.plan.ai_contract)+keyValues(D.plan.q0_requalification)+keyValues(D.plan.revert_contract)+keyValues(D.plan.cutover))}${details('初回登録報告の全項目（当時）',keyValues(rep))}</div>`;}
  function queueTable(items,head){return `<table class="queue-table" role="table"><caption class="sr-only">優先順の実行キュー</caption><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${items.map(q=>{const tone=q.active?'running':/不採用|完了|旧計画/.test(q.state)?'pending':'blocked';const cells=[`<strong>${q.priority}. ${rich(q.title)}</strong>`,`${chip(tone,q.state)}<p>${owner(q.owner)}</p>`,`${q.worlds==null?'世界数は対象外 / 時間未見積':q.worlds+'世界 / '+hours(q.hours)}<p class="scope-note">${rich(q.window)}</p>`,`${rich(q.dependency)}${refs(q.sources)}`];return `<tr>${cells.map((v,i)=>`<td data-label="${head[i]}"><div>${v}</div></td>`).join('')}</tr>`;}).join('')}</tbody></table>`;}
  function operations(){const r=read(D.plan.continuous_operation.current_run_ref),b=D.budget;const queueHead=['順番・作業','状態・担当','規模・全量見積','開始条件'];return `<div class="grid-2"><section class="card running-card"><div class="card-title"><div><p class="eyebrow">CURRENT WORK</p><h2>${rich(r.name)}</h2></div>${chip(r.completed_at?'done':'pending',r.state_label)}</div><p class="card-sub">${esc(r.branch)} · ${r.merged?'main統合済み':'未統合'}</p><p>${rich(r.note)}</p>${rawTable(r.measurements)}<ul>${r.limitations.map(text=>`<li>${rich(text)}</li>`).join('')}</ul>${r.completed_at?`<p>確認された完了時刻：${time(r.completed_at)}</p>`:''}<p class="scope-note">${rich(r.provenance)}</p><p class="scope-note">${rich(r.handoff)}</p>${refs(r.sources)}</section>
    <section class="card"><div class="card-title"><h2>${rich('forward100hの消化')}</h2>${chip('warning',b.consumption_status)}</div><div class="budget-values"><div><small>開発時間の総枠</small><strong>${esc(b.total_hours)} h</strong></div><div><small>枠内の実消化</small><strong>${b.consumed_forward_hours===null?'未確認':hours(b.consumed_forward_hours)}</strong></div><div><small>残り時間</small><strong>未確定</strong></div></div><p class="card-sub">過去の実測下限は ${esc(b.consumed_lower_bound_hours)} h以上。これは枠外の履歴です。開始・終了区間が未精算のため、${esc(b.total_hours)}hから引きません。</p><p class="scope-note">${rich(b.note)}</p>${refs(b.sources)}</section></div>
    <section class="card section"><h2>${rich(D.status.infrastructure.title)}</h2><p>${rich(D.status.infrastructure.note)}</p><p class="scope-note">${rich(D.status.infrastructure.boundary)}</p>${refs(D.status.infrastructure.sources)}</section>
    <details class="details-card section"><summary>旧運用・体制・予算配分の履歴</summary><div class="details-body"><section class="card section"><h2>夜間の消費概算・監視（履歴）</h2><p>${rich(b.overnight.note)}</p><p>${rich(D.status.night_operation.note)}</p>${refs(b.overnight.sources)}</section>
    <section class="card section">${sectionTitle('現在の体制・別ジョブ')}<div class="stack"><article><h3>${rich(D.status.team.primary)} 主 / ${rich(D.status.team.secondary)} 副</h3><p>${rich(D.status.team.unavailable)}</p><p>補助レビュー：${rich(D.status.team.support)}</p><p>独立レビュー：${rich(D.status.team.independent_review)}</p><p>入力方式：${rich(D.status.team.tool_policy)}</p><p class="scope-note">${rich(D.status.team.note)}</p>${refs(D.status.team.sources)}</article>${D.queue.side_jobs.map(j=>`<article><h3>${rich(j.title)}</h3><p>${rich(j.state)}</p><p>${rich(j.note)}</p>${refs(j.sources)}</article>`).join('')}</div></section>
    <section class="card section">${sectionTitle(D.plan.continuous_operation.title,chip('warning','運用接続は未確認'))}<p class="card-sub">${rich(D.plan.continuous_operation.note)}</p><p class="scope-note">${rich(D.status.repair_v5.note)}</p><div class="stack section">${details('段階・担当・最大待ち時間',rawTable({...D.plan.continuous_operation.stages,sources:D.plan.continuous_operation.sources,title:'1回目標'+D.plan.continuous_operation.iteration_target_minutes+'分・上限'+D.plan.continuous_operation.iteration_limit_minutes+'分、最大'+D.plan.continuous_operation.iteration_limit+'回（予算は別途確保）'}))}${details('Q0に進む診断screen',rawTable({...D.plan.continuous_operation.screen,sources:D.plan.continuous_operation.sources,title:'全'+D.plan.continuous_operation.validation_regimes+'×'+D.plan.continuous_operation.validation_seeds+'のfresh seed診断検証。資格試験は別集合'}))}</div>${refs(D.plan.continuous_operation.sources)}</section>
    </div></details>
    <section class="card table-card section"><div class="table-intro">${sectionTitle('実行キュー')}<p class="card-sub">${rich(D.queue.note)} 見積もりは全量分で、残り時間ではありません。</p></div>${queueTable(D.queue.items.filter(q=>q.current),queueHead)}${details('完了・停止した実行キューの履歴',queueTable(D.queue.items.filter(q=>!q.current),queueHead))}</section>
    <details class="details-card section"><summary>過去の予約配分・見積もり（現在の残量ではない）</summary><div class="details-body"><section class="grid-equal section"><div class="card">${sectionTitle(b.total_hours+'hの旧予約配分',`<small>履歴 / MASTER rev ${D.plan.revision}</small>`)}<p class="card-sub">過去の予約配分を保存しています。現在の残時間・追加実行枠ではありません。</p><div class="budget-allocation section">${b.rows.filter(r=>fraction(r.keep_hours)>0).map(r=>`<div class="budget-row"><div class="budget-row-title">${rich(r.title)}</div><div class="budget-row-value">${hours(r.keep_hours)}</div><div class="budget-row-track" aria-hidden="true"><div class="budget-row-fill" style="width:${fraction(r.keep_hours)/fraction(b.total_hours)*100}%"></div></div><div class="budget-row-note">${rich(r.accounting)}</div></div>`).join('')}</div>${refs(b.sources)}</div><div class="stack"><section class="card"><h2>追加実行を止めている費用</h2><p class="card-sub">${rich(b.on_note)}</p><div class="notice warning section">${rich(D.queue.bundle)}</div>${refs(b.sources)}</section>${details('予約の原数値・未採用案を照合',rawTable({header:['用途','現行KEEP h','旧AMEND h','会計区分・注記'],rows:b.rows.map(r=>[r.title,r.keep_hours,r.amend_hours,r.accounting+'。'+r.note]),sources:b.sources,title:'分数は原値 / 両列'+b.total_hours+'h。AMENDは未署名・不採用'}))}${details('時間概算・AI改訂の速度感度',rawTable({...b.on_sensitivity,title:'改訂ONの速度による見積もりの変化',sources:b.sources})+keyValues(b.consumption_estimate))}</div></section></div></details>`;}
  const normalize = value => String(value).normalize('NFKC').toLocaleLowerCase('ja');
  function filteredLogs(){const words=normalize(state.logQuery).trim().split(/\s+/).filter(Boolean);return D.log.items.filter(l=>(state.logType==='all'||l.type===state.logType)&&(state.logDate==='all'||l.timestamp.slice(0,10)===state.logDate)&&words.every(w=>normalize([l.id,l.summary,l.type,l.timestamp,l.event_date,l.time_basis,...l.sources.map(s=>sourceMap.get(s).title)].join(' ')).includes(w)));}
  function logItems(){const items=filteredLogs();return {count:items.length,html:items.length?`<ol>${items.map(l=>`<li class="log-entry"><div class="log-date"><time datetime="${l.timestamp}">${time(l.timestamp)}</time><small class="mono">${esc(l.id)}</small></div><div>${evidence(l.type)}<p class="log-summary">${rich(l.summary)}</p><details><summary>時刻の根拠・出来事の日付</summary><p>対象日 ${esc(l.event_date)} / ${esc(l.time_basis)}</p></details>${refs(l.sources)}</div></li>`).join('')}</ol>`:'<div class="empty"><strong>一致するログはありません</strong>検索語や種類・日付の条件を変えてください。</div>'};}
  function logs(){const found=logItems();return `<div class="toolbar"><div class="field search"><label for="log-search">ログを検索</label><input id="log-search" type="search" placeholder="候補名・出来事・出所など" value="${esc(state.logQuery)}"></div><div class="field"><label for="log-type">種類</label><select id="log-type"><option value="all">すべての種類</option>${D.log.allowed_types.map(t=>`<option${state.logType===t?' selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label for="log-date">記録日 · JST</label><select id="log-date"><option value="all">すべての日付</option>${[...new Set(D.log.items.map(l=>l.timestamp.slice(0,10)))].map(d=>`<option${state.logDate===d?' selected':''}>${d}</option>`).join('')}</select></div><button class="filter-button" type="button" data-reset="log">クリア</button><p class="result-count" id="log-count" aria-live="polite">${found.count} / ${D.log.items.length} 件</p></div><div class="notice">記録当時の内容を保持しています。現在地は「概要」を参照してください。正確な出来事の時刻が不明な記録には、移行・記録時刻の根拠があります。</div><section class="card section" id="log-items" aria-label="更新ログ">${found.html}</section>`;}
  function filteredTerms(){const words=normalize(state.termQuery).trim().split(/\s+/).filter(Boolean);return D.glossary.items.filter(t=>(state.termCategory==='all'||t.category===state.termCategory)&&words.every(w=>normalize([t.term,t.definition,...t.aliases].join(' ')).includes(w)));}
  function termItems(){const items=filteredTerms();return {count:items.length,html:items.length?items.map(t=>`<article class="card term-card" id="${t.id}" tabindex="-1"><span class="term-category">${esc(t.category)}</span><h2>${esc(t.term)}</h2><p>${esc(t.definition)}</p></article>`).join(''):'<div class="empty"><strong>一致する用語はありません</strong>別の語句で検索してください。</div>'};}
  function glossary(){const found=termItems();return `<div class="notice">本文の下線と ⓘ を押すと、その場で説明を開けます。用語は名前・略語・説明文から検索できます。</div><div class="toolbar section"><div class="field search"><label for="term-search">用語を検索</label><input type="search" id="term-search" placeholder="例：資格、T、何もしない" value="${esc(state.termQuery)}"></div><div class="field"><label for="term-category">分類</label><select id="term-category"><option value="all">すべての分類</option>${[...new Set(D.glossary.items.map(t=>t.category))].map(c=>`<option${state.termCategory===c?' selected':''}>${esc(c)}</option>`).join('')}</select></div><button class="filter-button" type="button" data-reset="terms">クリア</button><p class="result-count" id="term-count" aria-live="polite">${found.count} / ${D.glossary.items.length} 語</p></div><div id="term-items" class="glossary-grid">${found.html}</div><div class="section">${details('参照資料',`<ol class="timeline">${D.sources.sources.map(s=>`<li><h3><a href="../../${esc(s.path)}">${esc(s.title)} ↗</a></h3><p>${esc(s.locator)}</p></li>`).join('')}</ol>`)}</div>`;}
  const renderers={overview,plan,results,blockers,decisions,operations,log:logs,glossary};
  const iconPaths={overview:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',plan:'M6 4v16M6 6h12M6 12h9M6 18h14',results:'M4 20V10M10 20V4M16 20v-8M22 20H2',blockers:'m12 3 10 18H2L12 3zm0 6v5m0 3v1',decisions:'M5 4h14v16H5zM8 9l2 2 5-5M8 16h8',operations:'m8 4 12 8-12 8V4z',log:'M3 12a9 9 0 1 0 3-7M3 3v5h5m4-2v6l4 2',glossary:'M3 4h7l2 2 2-2h7v16h-7l-2 1-2-1H3V4zm9 2v15'};
  const icon = key => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${iconPaths[key]}"></path></svg>`;
  function navigation(){document.getElementById('navigation').innerHTML=`<ul class="nav-list">${D.ui.pages.map(p=>`<li><a href="#${p.key}" class="nav-link"${state.page===p.key?' aria-current="page"':''}>${icon(p.icon)}<span>${esc(p.label)}</span>${p.key==='log'?`<span class="nav-count">${D.log.items.length}</span>`:''}</a></li>`).join('')}</ul>`;}
  let activeTermButton=null;
  function closeTerm(focus=false){const pop=document.getElementById('term-popover');pop.hidden=true;if(activeTermButton){activeTermButton.setAttribute('aria-expanded','false');if(focus)activeTermButton.focus();}activeTermButton=null;}
  function showTerm(button){const t=terms.get(button.dataset.term);if(!t)return;closeTerm();activeTermButton=button;button.setAttribute('aria-expanded','true');const pop=document.getElementById('term-popover');pop.innerHTML=`<button type="button" class="close" data-close-term aria-label="説明を閉じる">×</button><span class="term-category">${esc(t.category)}</span><h2 id="term-popover-title">${esc(t.term)}</h2><p>${esc(t.definition)}</p><a href="#glossary/${t.id}">用語集で見る →</a>`;pop.hidden=false;pop.querySelector('button').focus();}
  function render(focus=false){explained=new Set();closeTerm();const page=D.ui.pages.find(p=>p.key===state.page)||D.ui.pages[0];navigation();document.getElementById('breadcrumb-current').textContent=page.label;document.title=`${page.label} · ASCON`;document.getElementById('page').innerHTML=`<header class="page-heading"><div><p class="eyebrow">${esc(page.eyebrow)}</p><h1 id="page-title" tabindex="-1">${esc(page.label)}</h1><p class="page-description">${rich(page.description)}</p></div><div class="heading-aside">${esc(D.ui.brand)} / 保存計画 rev ${D.plan.revision}</div></header><div class="page-body">${renderers[state.page]()}</div>`;if(focus){document.getElementById('page-title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
  function route(focus=false){const [page,term]=location.hash.slice(1).split('/');if(page==='main'){document.getElementById('main').focus();return;}state.page=renderers[page]?page:'overview';if(term&&state.page==='glossary'){state.termQuery='';state.termCategory='all';}render(focus);if(term&&terms.has(term)){document.getElementById(term)?.scrollIntoView({block:'center'});document.getElementById(term)?.focus({preventScroll:true});}}
  function updateLog(){explained=new Set();closeTerm();const found=logItems();document.getElementById('log-items').innerHTML=found.html;document.getElementById('log-count').textContent=`${found.count} / ${D.log.items.length} 件`;}
  function updateTerms(){const found=termItems();document.getElementById('term-items').innerHTML=found.html;document.getElementById('term-count').textContent=`${found.count} / ${D.glossary.items.length} 語`;}
  document.addEventListener('click',event=>{const target=event.target.closest('[data-term],[data-close-term],[data-results],[data-risk],[data-reset]');if(!target)return;
    if(target.hasAttribute('data-term'))showTerm(target);
    else if(target.hasAttribute('data-close-term'))closeTerm(true);
    else if(target.hasAttribute('data-results')){state.results=target.dataset.results;render();document.querySelector(`[data-results="${state.results}"]`).focus();}
    else if(target.hasAttribute('data-risk')){state.risk=target.dataset.risk;render();document.querySelector(`[data-risk="${state.risk}"]`).focus();}
    else if(target.dataset.reset==='log'){state.logQuery='';state.logType='all';state.logDate='all';render();document.getElementById('log-search').focus();}
    else {state.termQuery='';state.termCategory='all';render();document.getElementById('term-search').focus();}
  });
  document.addEventListener('input',event=>{if(event.target.id==='log-search'){state.logQuery=event.target.value;updateLog();}if(event.target.id==='term-search'){state.termQuery=event.target.value;updateTerms();}});
  document.addEventListener('change',event=>{const {id,value}=event.target;if(id==='log-type'){state.logType=value;updateLog();}if(id==='log-date'){state.logDate=value;updateLog();}if(id==='term-category'){state.termCategory=value;updateTerms();}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeTerm(true);});
  window.addEventListener('hashchange',()=>route(true));
  try {
    document.getElementById('brand-name').textContent=D.ui.brand;document.getElementById('brand-sub').textContent=D.ui.tagline;
    document.getElementById('sidebar-foot').innerHTML=`<strong>提出締切 ${dateOnly(D.plan.deadline_at)}</strong>${D.plan.deadline_at.slice(11,16)} JST · MASTER rev ${D.plan.revision}<br>記録の更新はファイルの再読込で反映`;
    const updated=document.getElementById('updated-at');updated.textContent='更新 '+time(D.status.as_of);updated.setAttribute('datetime',D.status.as_of);
    document.getElementById('footer').innerHTML=`<div><span>基準時点 ${esc(D.status.as_of.slice(0,10))} ${esc(D.status.as_of.slice(11,16))} JST · ${D.log.items.length}件の履歴 · ローカル保存資料のみ</span><p>原ログ・実機・オンライン規約の再監査なし。本人引継ぎとファイル確認を区別。</p><details><summary>根拠ファイル</summary><ul>${D.status.footer_sources.map(id=>{const s=sourceMap.get(id);return `<li><a href="../../${esc(s.path)}">${esc(s.path.split('/').pop())}</a></li>`;}).join('')}</ul></details></div>`;
    route();
  } catch(error) {const el=document.getElementById('render-error');el.hidden=false;el.className='error-box';el.textContent='記録を表示できません。データの形式を確認してください。 '+error.message;}
  // Read-only test surface: the same renderers and filters as the UI. No I/O or run access.
  if(typeof globalThis.__DASHBOARD_TEST__==='function')globalThis.__DASHBOARD_TEST__({D,state,renderers,render,route,rich,esc,filteredLogs,filteredTerms,read,chip,closeTerm});
})();
</script>
</body>
