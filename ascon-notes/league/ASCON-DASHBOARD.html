<body>
<a href="#plan" class="skip">全体計画へ</a>
<div class="wrap">
<header id="overview"></header>
<nav aria-label="ダッシュボード内の移動"><a href="#plan">全体計画</a><a href="#progress">進捗</a><a href="#blockers">ブロッカー候補</a><a href="#next">今後の計画</a><a href="#results">結果の要約</a><a href="#decisions">決定の台帳</a><a href="#log">ログ</a><a href="#sources">出典</a></nav>
<noscript><p class="error">表示にはJavaScriptが必要です。事実はファイル冒頭の data-* JSON に保存されています。計画と生成表は同じフォルダのMarkdownを参照してください。</p></noscript>
<div id="render-error" role="alert" hidden></div>
<main>
<section id="plan"><div class="section-heading"><p class="eyebrow">01 · PLAN</p><h2>全体計画</h2></div><div id="plan-body"></div></section>
<section id="progress"><div class="section-heading"><p class="eyebrow">02 · PROGRESS</p><h2>進捗</h2></div><div id="progress-body"></div><div id="budget-body"></div></section>
<section id="blockers"><div class="section-heading"><p class="eyebrow">03 · BLOCKERS</p><h2>ブロッカー（候補）</h2></div><div id="blockers-body"></div></section>
<section id="next"><div class="section-heading"><p class="eyebrow">04 · NEXT</p><h2>今後の計画</h2></div><div id="next-body"></div></section>
<section id="results"><div class="section-heading"><p class="eyebrow">05 · EVIDENCE</p><h2>結果の要約</h2></div><div id="results-body"></div></section>
<section id="decisions"><div class="section-heading"><p class="eyebrow">06 · DECISIONS</p><h2>決定の台帳</h2></div><div id="decisions-body"></div></section>
<section id="log"><div class="section-heading"><p class="eyebrow">07 · CHANGELOG</p><h2>ログ</h2></div><div id="log-body"></div></section>
<section id="sources"><div class="section-heading"><p class="eyebrow">08 · SOURCES</p><h2>出典と更新方法</h2></div><div id="sources-body"></div></section>
</main>
<footer>ASCON · Living dashboard · Light / local / data-driven</footer>
</div>
<script>
(() => {
  'use strict';
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  try {
    const D = Object.fromEntries([...document.querySelectorAll('script[type="application/json"][id^="data-"]')].map(el => [el.id.slice(5), JSON.parse(el.textContent)]));
    const {status:S, plan:P, results:R, budget:B} = D;
    const sourceMap = Object.fromEntries(D.sources.sources.map(s => [s.id,s]));
    // Source links resolve against the page URL; a data:/about: origin (previews, embedded viewers) cannot, so fall back to the plain relative path instead of failing the whole page.
    const hrefFor = path => { try { return new URL(path, new URL('../../', location.href)).href; } catch (_) { return '../../' + path; } };
    const refs = ids => `<div class="source-links">${(ids||[]).map(id => {const s=sourceMap[id];return `<a href="${esc(hrefFor(s.path))}" title="${esc(s.locator)}">${esc(s.title)}</a>`;}).join('')}</div>`;
    const stateNames = {done:'完了',running:'進行中',pending:'未実施',blocked:'BLOCKED',failed:'FAIL',open:'open',waiting:'証拠待ち',mitigating:'対策中',decided:'決定済み',closed:'終了',unsigned:'未署名','confirmation-pending':'本人確認待ち'};
    const tone = v => ({done:'good',decided:'good',failed:'bad',blocked:'warn',running:'accent',open:'warn',waiting:'warn',unsigned:'warn','confirmation-pending':'warn'}[v]||'');
    const badge = v => `<span class="badge ${tone(v)}">${esc(stateNames[v]||v)}</span>`;
    const date = v => v.slice(5).replace('-','/');
    const jst = v => v.slice(0,19).replace('T',' ')+' JST';
    const num = v => Number(String(v).replaceAll(',',''));
    const frac = v => {if(v===null)return null;const p=String(v).split('/').map(Number);return p.length===2?p[0]/p[1]:p[0];};
    const hours = v => v===null?'未見積':`${frac(v).toFixed(2)} h`;
    const put = (id, html) => {document.getElementById(id).innerHTML=html;};
    const detail = (label,html) => `<details><summary>${esc(label)}</summary>${html}</details>`;
    const table = (heads,rows,klass='') => `<div class="table-wrap"><table class="${klass}"><thead><tr>${heads.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-label="${esc(heads[i])}"><div>${c}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const rawTable = t => table(t.header,t.rows.map(r=>r.map(esc)),'result-table');
    const card = (title,content,cls='') => `<article class="card ${cls}"><h3>${esc(title)}</h3>${content}</article>`;
    const figure = (title,content,note='',src=[]) => `<div class="figure reveal"><h3>${esc(title)}</h3>${content}${note?`<p class="note">${esc(note)}</p>`:''}${refs(src)}</div>`;
    const barChart = (rows,unit='',signed=false) => {
      const max=Math.max(...rows.map(r=>Math.abs(num(r.value))),1);
      return `<div class="scale"><span>${signed?esc((-max).toFixed(2)):'0'} ${esc(unit)}</span>${signed?'<span>0</span>':''}<span>${esc(max.toFixed(2))} ${esc(unit)}</span></div><div class="bars">${rows.map(r=>{const v=num(r.value),w=Math.abs(v)/max*(signed?50:100),left=signed?(v<0?50-w:50):0;return `<div class="bar"><span class="bar-label">${esc(r.label)}</span><span class="track ${signed?'signed':''}" aria-hidden="true"><i class="fill" style="--w:${w}%;--left:${left}%;--c:var(--${r.color||(v<0?'bad':'accent')})"></i></span><span class="bar-value">${esc(r.value)}</span></div>`;}).join('')}</div>`;
    };
    const dayCard = m => `<article class="day ${m.decision_refs.length?'human':''}"><div class="milestone-top"><time datetime="${esc(m.date)}">${date(m.date)}</time>${badge(m.state)}</div><h3>${esc(m.title)}</h3><p>入口：${esc(m.dependency)}</p><p>停止：${esc(m.stop)}</p>${m.decision_refs.map(id=>`<a class="small" href="#${id}">${id}</a>`).join(' · ')}${refs(m.sources)}</article>`;
    const phase=D.phases.items.find(p=>p.id===S.phase_id);
    put('overview',`<p class="kicker">ASCON / LIVING DASHBOARD</p><div class="header-meta"><span class="badge accent">${esc(phase.title)} · ${esc(phase.gate)}</span><time datetime="${esc(S.as_of)}">As of ${esc(jst(S.as_of))}</time></div><h1>${esc(S.headline)}</h1><p class="tagline">${esc(S.subhead)}</p><div class="stats">${S.metrics.map(m=>`<article class="stat ${m.tone}"><p class="small">${esc(m.label)}</p><div class="value">${esc(m.value)}</div><p class="small">${esc(m.note)}</p>${refs(m.sources)}</article>`).join('')}</div><p class="small">測定資料：${esc(jst(S.measurement_as_of))} の引継ぎ。Q0b ${esc(S.q0b.started_at.slice(11,16))}開始 / ${S.q0b.worlds}世界 / ${S.q0b.chunks} chunks / seeds ${esc(S.q0b.seeds)} / 終了見込み ${esc(S.q0b.expected_end.slice(11,16))} JST。</p><p class="note">${esc(S.q0b.note)}</p><div class="last-update"><b>最終更新</b> ${esc(S.last_update)}${refs(S.sources)}</div><p class="note">${esc(S.notice)}</p>`);
    put('plan-body',`<p class="tagline">${esc(P.goal)}</p><div class="phase-strip">${D.phases.items.map(p=>`<div class="phase ${p.id===S.phase_id?'current':''}"><span class="mono">${date(p.start_date)}–${date(p.end_date)}</span><b>${esc(p.title)}</b>${badge(p.state)}<p>${esc(p.gate)}</p></div>`).join('')}</div><div class="flow reveal">${P.protocol.map(p=>card(p.title,`<p>${esc(p.body)}</p><p><b>出口</b> ${esc(p.exit)}</p>`)).join('')}</div>${refs(P.sources)}<div class="grid" style="margin-top:24px">${card('勝つために守る指標',`<p>${esc(P.win)}</p><p>${esc(P.caution)}</p>`)}${card('ルールと制約',`<ul>${P.rules.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`)}</div>${figure('ロードマップ / 日付は実行許可ではない',`<div class="timeline">${D.milestones.items.filter(m=>m.highlight).map(dayCard).join('')}</div>${detail('全日程を開く',`<div class="timeline">${D.milestones.items.map(dayCard).join('')}</div>`)}`,'既決の判断は決定台帳へリンク。予定は条件付きで、実績と区別する。',D.milestones.sources)}`);
    put('progress-body',figure('ワークストリーム別',D.progress.workstreams.map(w=>{const rows=D.progress.items.filter(i=>i.workstream===w),done=rows.filter(i=>i.state==='done').length;return `<div class="workstream"><div class="workstream-head"><b>${esc(w)}</b><span class="mono">${done} / ${rows.length} 完了</span></div><div class="track" aria-hidden="true"><i class="fill" style="--w:${done/rows.length*100}%;--c:var(--good)"></i></div><p class="small">${rows.filter(i=>i.state!=='done').map(i=>`${esc(i.title)} ${badge(i.state)}`).join(' / ')||'登録済みの作業は完了'}</p></div>`;}).join(''),D.progress.note,D.progress.sources)+table(['状態','作業','証拠と残る条件'],D.progress.items.map(i=>[badge(i.state),esc(i.title),esc(i.evidence)+refs(i.sources)])));
    const colors=['faint','good','accent','warn','cluster-g','cluster-a','cluster-b','cluster-e','cluster-d','cluster-f','faint'];
    const budgetColumn = column => `<h3>${esc(column.title)} · ${esc(column.state)} · ${esc(B.total_hours)} h</h3><div class="stack" aria-hidden="true">${B.rows.map((r,i)=>frac(r[column.key])>0?`<i style="--hours:${frac(r[column.key])};--c:var(--${colors[i%colors.length]})"></i>`:'').join('')}</div><div class="budget-key">${B.rows.filter(r=>frac(r[column.key])>0).map(r=>`<div><span class="swatch" style="--c:var(--${colors[B.rows.indexOf(r)%colors.length]})"></span>${esc(r.title)} <b>${hours(r[column.key])}</b><div class="small">${esc(r.accounting)}</div></div>`).join('')}</div>`;
    put('budget-body',figure('計算予算 / 実測下限・推定・予約を分ける',`<p><b>${esc(B.interpretation)}</b></p><p class="small">起点 ${esc(jst(B.start_at))}</p><div class="bars" style="margin:20px 0"><div class="bar"><span>履歴の下限</span><span class="track" aria-hidden="true"><i class="fill" style="--w:${Math.min(100,frac(B.consumed_lower_bound_hours)/frac(B.total_hours)*100)}%;--c:var(--good)"></i></span><span>≥${esc(B.consumed_lower_bound_hours)} h</span></div></div><p class="small">${esc(B.historic_bar_note)}</p><p class="note">${esc(B.note)}</p><div style="margin-top:24px">${budgetColumn(B.columns[0])}</div>${detail('未署名AMENDとの配分比較',budgetColumn(B.columns[1]))}${detail('正確な分数・会計区分・根拠を見る',table(['用途','KEEP h','AMEND h','会計','根拠/注記'],B.rows.map(r=>[esc(r.title),esc(r.keep_hours),esc(r.amend_hours),esc(r.accounting),esc(r.note)+refs(r.sources)])))}${detail('ON速度が変わった場合',rawTable(B.on_sensitivity)+`<p class="note">${esc(B.on_note)}</p>`)}`,'予約の100h一致は、実消費が100h以内に収まる保証ではない。',B.sources));
    const BI=D.blockers;
    const matrix=`<div class="matrix" role="group" aria-label="影響（横軸）と可能性（縦軸）の定性マトリクス"><div></div>${BI.impact_axis.map(a=>`<div class="matrix-label">影響 ${esc(a)}</div>`).join('')}${[...BI.likelihood_axis].reverse().map(l=>`<div class="matrix-label">${esc(l)}</div>${BI.impact_axis.map(impact=>`<div class="cell ${l==='高'&&impact!=='中'?'high':''}">${BI.items.filter(b=>b.likelihood===l&&b.impact===impact).map(b=>`<a href="#${b.id}" title="${esc(b.title)}">${b.id}</a>`).join(' ')||'—'}</div>`).join('')}`).join('')}</div>`;
    put('blockers-body',`<div class="grid">${figure('可能性 × 影響',matrix,'縦軸：可能性。定性的な分類で、確率ではない。')}${card('優先する不確実性',`<p>${esc(BI.method)}</p><p>${BI.items.slice(0,3).map(b=>`<a href="#${b.id}">${b.id} ${esc(b.title)}</a>`).join('<br>')}</p>${refs(BI.sources)}`)}</div>`+table(['順位 / ID','候補','severity','likelihood','impact','owner','status','evidence','mitigation / next action'],BI.items.map(b=>[`<span id="${b.id}">${b.rank} / ${b.id}</span>`,esc(b.title),badge(b.severity),esc(b.likelihood),esc(b.impact),esc(b.owner),badge(b.status),esc(b.evidence)+refs(b.sources),esc(b.mitigation)]),'blocker-table'));
    const q = D.queue;
    const today=S.as_of.slice(0,10),cutoff=new Date(today+'T00:00:00+09:00');cutoff.setUTCDate(cutoff.getUTCDate()+7);
    put('next-body',`<p>${esc(q.note)}</p><ol class="queue">${q.items.map(i=>`<li class="${i.active?'':'inactive'}"><span class="number">${i.priority.toString().padStart(2,'0')}</span><div><h3>${esc(i.title)} ${badge(i.state)}</h3><p>${esc(i.dependency)}</p><p class="small">${esc(i.window)} · owner ${esc(i.owner)} · ${i.worlds} 世界</p>${refs(i.sources)}</div><div class="hours">${hours(i.hours)}<div class="small">${i.hours===null?'割当未確定':'全量見積'}</div></div></li>`).join('')}</ol><div class="last-update">${esc(q.bundle)}${refs(q.sources)}</div>${figure('次の7日間',`<div class="grid">${D.milestones.items.filter(m=>m.date>=today&&new Date(m.date+'T00:00:00+09:00')<cutoff).map(dayCard).join('')}</div>`)}<h3>何を見ればゲートが閉じるか</h3><div class="grid">${P.gates.map(g=>card(g.title,`${badge(g.state)}<p>${esc(g.resolve)}</p>${refs(g.sources)}`)).join('')}</div>`);
    let resultsHtml='';
    resultsHtml+=figure(R.d0.title,`<div class="grid"><div><h3>P−noop / USDC</h3>${barChart(R.d0.rows.map(r=>({label:r[0],value:r[2]})),'USDC',true)}</div><div><h3>優先手数料0の送信割合</h3>${barChart(R.d0.rows.map(r=>({label:r[0],value:r[6].match(/\(([\d.]+)%\)/)[1],color:'bad'})),'%')}</div></div>${detail('生成表を開く',rawTable(R.d0))}`,R.d0.note,R.d0.sources);
    resultsHtml+=figure(R.fields.title,`<div class="grid">${[...new Set(R.fields.rows.map(r=>r[0]))].map(field=>`<div><h3>${esc(field)} · ${esc(R.fields.rows.find(r=>r[0]===field)[1])}</h3>${barChart(R.fields.rows.filter(r=>r[0]===field).map(r=>({label:r[2],value:r[3],color:r[2]==='sonnet-1'?'accent':'faint'})),field==='F_ref'?'USDC':'T')}</div>`).join('')}</div>`,R.fields.note,R.fields.sources);
    const QS=R.q0_summary;
    resultsHtml+=figure(R.q0.title,`<div class="grid"><div><h3>対noop / レジーム平均ΔT</h3>${barChart(R.q0.rows.map(r=>({label:r[0],value:r[5]})),'ΔT')}</div><div><h3>平均T / sonnet・multi-arb</h3><div class="legend"><span><i class="swatch" style="--c:var(--accent)"></i>sonnet</span><span><i class="swatch" style="--c:var(--faint)"></i>multi-arb</span></div>${barChart(R.q0.rows.flatMap(r=>[{label:r[0]+' / S',value:r[6]},{label:r[0]+' / M',value:r[7],color:'faint'}]))}</div></div><div class="stats"><div class="stat bad"><p class="small">等重み平均T / 候補</p><div class="value">${QS.candidate_t}</div></div><div class="stat"><p class="small">等重み平均T / multi-arb</p><div class="value">${QS.multi_t}</div></div><div class="stat warn"><p class="small">noop割れ世界</p><div class="value">${QS.noop_below}</div></div><div class="stat"><p class="small">送信失敗 / mined revert</p><div class="value">${QS.submit_failed} / ${QS.mined_reverts}</div></div></div><p class="note">${esc(QS.safety)}</p>${detail('全レジームの生成表を開く',rawTable(R.q0))}`,R.q0.note,R.q0.sources);
    const clusterColor = c => 'cluster-'+c.toLowerCase();
    const models=R.model_order.map(model=>{const counts=R.m1.rows.map(row=>{const match=row[3].match(new RegExp(model+'(?:×(\\d+))?'));return {cluster:row[0],count:match?Number(match[1]||1):0};}).filter(c=>c.count);const total=counts.reduce((a,c)=>a+c.count,0);return `<div class="model-row"><b>${esc(model)}</b><div class="model-track">${counts.map(c=>`<span class="model-cell" style="--count:${c.count};--c:var(--${clusterColor(c.cluster)})">${esc(c.cluster)} ×${c.count}</span>`).join('')}</div><span>${counts.length}機構 / ${total}仕様</span></div>`;}).join('');
    resultsHtml+=figure(R.m1.title,models+`<div class="legend">${R.m1.rows.map(r=>`<span><i class="swatch" style="--c:var(--${clusterColor(r[0])})"></i>${esc(r[0])} ${esc(r[1])}</span>`).join('')}</div>${detail('仕様ID・作者の生成表を開く',rawTable(R.m1))}`,R.m1.note,R.m1.sources);
    resultsHtml+=`<div class="grid three">${R.research.map(r=>card(r.title,`<p>${esc(r.text)}</p>${refs(r.sources)}`)).join('')}</div>`;
    resultsHtml+=figure(R.strategies.title,`<div class="player-grid">${R.strategies.rows.map(r=>`<article class="card player-card"><h3>${esc(r[0])}</h3><p class="small">${esc(r[1])}</p><div class="player-metrics"><div>平均T<br><strong>${esc(r[7])}</strong></div><div>最悪<br><b class="mono">${esc(r[8])}</b></div></div><div class="track" aria-hidden="true"><i class="fill" style="--w:${num(r[7])/Math.max(...R.strategies.rows.map(s=>num(s[7])))*100}%"></i></div><p style="margin-top:12px">${esc(r[2])}</p><dl>${['入口','size','bid','専門'].map((label,i)=>`<dt>${label}</dt><dd>${esc(r[i+3])}</dd>`).join('')}</dl></article>`).join('')}</div>${detail('元の比較表を開く',rawTable(R.strategies))}`,R.strategies.note,R.strategies.sources);
    resultsHtml+=figure(R.ranking.title,barChart([...R.ranking.rows].sort((a,b)=>num(b[1])-num(a[1])).map(r=>({label:r[0],value:r[1],color:r[0]==='inc-zeta'?'accent':r[0]==='zeta-2'?'bad':'faint'})),'T')+detail('条件付き区間・レジーム内訳',rawTable(R.ranking)),R.ranking.note,R.ranking.sources);
    const zr=R.zeta.rows[0];
    resultsHtml+=figure(R.zeta.title,barChart([{label:'noop / '+zr[0],value:zr[3],color:'faint'},{label:'inc-zeta',value:zr[2],color:'accent'},{label:'zeta-2',value:zr[1],color:'bad'}],'USDC',true)+detail('診断ケースの生成表',rawTable(R.zeta)),R.zeta.note,R.zeta.sources);
    resultsHtml+=`<h3>過去の実装・測定から残すこと</h3><div class="grid three">${R.archive.map(r=>card(r.title,`<p>${esc(r.text)}</p>${refs(r.sources)}`)).join('')}</div>`;
    put('results-body',resultsHtml);
    put('decisions-body',`<p class="note">${esc(D.decisions.date_note)}</p>`+table(['ID / 日付','本人判断','状態 / 期日','運用と証拠'],D.decisions.items.map(d=>[`<span id="${d.id}">${esc(d.id)}</span><br><time datetime="${d.date}">${esc(d.date)}</time>`,esc(d.title),badge(d.status)+(d.due_date?`<br><time datetime="${d.due_date}">${esc(d.due_date)}</time>`:''),esc(d.note)+refs(d.sources)])));
    put('log-body',`<p class="note">${esc(D.log.note)}</p><div class="log-tools"><label for="log-filter">種類</label><select id="log-filter"><option value="all">すべて</option>${D.log.allowed_types.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}</select><span id="log-count" class="small"></span></div><ol class="log-list">${D.log.items.map(l=>`<li data-type="${esc(l.type)}" id="${l.id}"><div><time datetime="${esc(l.timestamp)}">${esc(jst(l.timestamp))}</time><small>対象 ${esc(l.event_date)}<br>${esc(l.time_basis)}</small></div><div><p>${badge('['+l.type+']')} ${esc(l.summary)}</p>${refs(l.sources)}</div></li>`).join('')}</ol>`);
    const filter=document.getElementById('log-filter');
    function filterLogs(){let count=0;document.querySelectorAll('.log-list li').forEach(el=>{el.hidden=filter.value!=='all'&&el.dataset.type!==filter.value;if(!el.hidden)count++;});document.getElementById('log-count').textContent=`${count} / ${D.log.items.length} 件`;}
    filter.addEventListener('change',filterLogs);filterLogs();
    put('sources-body',`<p>更新はファイル冒頭の <span class="mono">data-*</span> JSON。数字は生成済みの表から転記し、訂正はログに追記します。</p>${refs(['src-handoff'])}<ul class="source-catalog">${D.sources.sources.map(s=>`<li><a href="${esc(hrefFor(s.path))}">${esc(s.title)}</a><small>${esc(s.path)} · ${esc(s.locator)}</small></li>`).join('')}</ul>`);
    const reveals=[...document.querySelectorAll('.reveal')];
    if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion');
      const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:0,rootMargin:'0px 0px -16px 0px'});
      reveals.forEach(el=>io.observe(el));
    } else reveals.forEach(el=>el.classList.add('in'));
    // Contents inside closed details become visible when opened, including animated charts.
    document.querySelectorAll('details').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)el.classList.add('in');}));
    let opened=[];
    window.addEventListener('beforeprint',()=>{opened=[...document.querySelectorAll('details:not([open])')];opened.forEach(el=>{el.open=true;});});
    window.addEventListener('afterprint',()=>opened.forEach(el=>{el.open=false;}));
  } catch (error) {
    const el=document.getElementById('render-error');el.hidden=false;el.className='error';el.textContent='データを表示できません。dashboard-check.pyでJSONを確認してください。 '+error.message;
  }
})();
</script>
</body>
</html>
